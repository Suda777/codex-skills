<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T06 组件目录</title><link rel="stylesheet" href="tokens.css"></head>
<body class="component-page">
  <main class="component-shell">
    <header class="component-header"><p class="eyebrow">T06 · COMPONENT CATALOG</p><h1>数智服务运营台</h1><p>本页只展示视觉构造。示例控件均为真实禁用态，不承担业务动作；完整交互请查看 starter.html。</p></header>
    <div class="component-grid">
      <section class="component-surface" aria-labelledby="colorTitle"><h2 id="colorTitle">色彩与层级</h2><div class="swatch-grid"><span class="swatch"><i style="background:#11235a"></i>深蓝导航</span><span class="swatch"><i style="background:#3569f4"></i>服务蓝</span><span class="swatch"><i style="background:#7c4dff"></i>渐变紫</span><span class="swatch"><i style="background:#20b486"></i>闭环绿</span><span class="swatch"><i style="background:#f4f7ff"></i>页面底色</span></div></section>
      <section class="component-surface" aria-labelledby="buttonTitle"><h2 id="buttonTitle">操作语言</h2><div class="component-row"><button class="gradient-button" type="button" disabled title="组件目录仅展示样式">主操作</button><button class="secondary-button" type="button" disabled title="组件目录仅展示样式">次操作</button><button class="text-button" type="button" disabled title="组件目录仅展示样式">文字操作</button><button class="icon-button" type="button" disabled title="组件目录仅展示样式" aria-label="图标按钮示例，组件目录中不可操作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></section>
      <section class="component-surface" aria-labelledby="metricTitle"><h2 id="metricTitle">圆角指标卡</h2><article class="metric-orb violet"><span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8"/></svg></span><div><span>开放工单</span><strong>18</strong><small class="metric-trend">较上周期减少 3 条</small></div></article></section>
      <section class="component-surface" aria-labelledby="statusTitle"><h2 id="statusTitle">服务状态</h2><div class="component-row"><span class="status-pill status-wait">待响应</span><span class="status-pill status-active">处理中</span><span class="status-pill status-review">待验收</span><span class="status-pill status-done">已解决</span><span class="status-pill status-risk">有风险</span></div></section>
      <section class="component-surface" aria-labelledby="fieldTitle"><h2 id="fieldTitle">输入与筛选</h2><div class="form-grid"><div class="field"><label for="componentKeyword">搜索工单</label><input id="componentKeyword" type="search" value="服务响应" disabled title="组件目录仅展示样式"></div><div class="field"><label for="componentRegion">服务区域</label><select id="componentRegion" disabled title="组件目录仅展示样式"><option>华东</option></select></div></div></section>
      <section class="component-surface" aria-labelledby="noticeComponentTitle"><h2 id="noticeComponentTitle">通知条目</h2><ul class="notice-list"><li class="notice-item"><i aria-hidden="true"></i><span><strong>华南有 2 条风险工单</strong><small>10 分钟前 · 未读</small></span></li><li class="notice-item read"><i aria-hidden="true"></i><span><strong>服务网络同步完成</strong><small>今天 09:10 · 已读</small></span></li></ul></section>
    </div>
  </main>
</body>
</html>
