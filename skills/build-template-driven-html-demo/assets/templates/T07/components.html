<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T07 组件目录</title><link rel="stylesheet" href="tokens.css"></head>
<body class="component-page">
  <main class="component-shell">
    <header class="component-header"><p class="eyebrow">T07 · COMPONENT CATALOG</p><h1>AI 数据中台</h1><p>本页展示轻量数据后台的视觉构造。控件均为真实禁用态；完整行为在 starter.html 中演示。</p></header>
    <div class="component-grid">
      <section class="component-card" aria-labelledby="t07Colors"><h2 id="t07Colors">中性色与主色</h2><div class="swatches"><span class="swatch"><i style="background:#465fff"></i>主操作</span><span class="swatch"><i style="background:#1d2939"></i>主文本</span><span class="swatch"><i style="background:#667085"></i>次文本</span><span class="swatch"><i style="background:#e6e8ec"></i>细边框</span><span class="swatch"><i style="background:#f7f8fa"></i>页面底色</span></div></section>
      <section class="component-card" aria-labelledby="t07Actions"><h2 id="t07Actions">操作与主题</h2><div class="component-row"><button class="primary-button" type="button" disabled title="组件目录仅展示样式">主操作</button><button class="secondary-button" type="button" disabled title="组件目录仅展示样式">次操作</button><button class="square-button" type="button" disabled title="组件目录仅展示样式" aria-label="图标按钮示例，组件目录中不可操作"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></section>
      <section class="component-card" aria-labelledby="t07Metric"><h2 id="t07Metric">单色指标卡</h2><article class="stat-card"><span class="stat-icon blue" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h8M6 8h12v12H6zM9 12h6"/></svg></span><div><span>统计期任务</span><strong>18</strong><small>近 30 天 Mock 数据</small></div></article></section>
      <section class="component-card" aria-labelledby="t07Status"><h2 id="t07Status">任务状态</h2><div class="component-row"><span class="status-tag queued">排队中</span><span class="status-tag running">运行中</span><span class="status-tag review">待确认</span><span class="status-tag complete">已完成</span><span class="status-tag failed">失败</span></div></section>
      <section class="component-card" aria-labelledby="t07Fields"><h2 id="t07Fields">筛选字段</h2><div class="form-layout"><div class="field"><label for="catalogTask">任务搜索</label><input id="catalogTask" value="分类评估" disabled title="组件目录仅展示样式"></div><div class="field"><label for="catalogStatus">运行状态</label><select id="catalogStatus" disabled title="组件目录仅展示样式"><option>运行中</option></select></div></div></section>
      <section class="component-card" aria-labelledby="t07Load"><h2 id="t07Load">质量与负载</h2><div class="quality-bars"><div class="quality-row"><span>90–100 分</span><span class="quality-track"><i style="width:76%;background:var(--success)"></i></span><strong>4</strong></div><div class="quality-row"><span>70–79 分</span><span class="quality-track"><i style="width:42%;background:var(--warning)"></i></span><strong>2</strong></div></div></section>
    </div>
  </main>
</body>
</html>
